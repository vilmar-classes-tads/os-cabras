
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar o JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compilar, testar e empacotar com Maven
      run: mvn clean package

    - name: Construir imagem Docker
      run: docker build -t sistema-editais:latest .

    - name: Testar execucao do container
      run: |
        output=$(printf '%s\n' \
          'Usuario Teste Docker' \
          '52998224725' \
          'teste@example.com' \
          'senha123' \
          'IFPE Recife' \
          'Tecnologia da Informacao' \
          '-' \
          'Graduacao' \
          '-' \
          '' '' '' '' \
          | docker run --rm -i sistema-editais:latest)

        echo "$output"
        echo "$output" | grep -q "=== Fim do cadastro ==="
